services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      searxng:
        condition: service_started
    environment:
      DATABASE_URL: mysql+pymysql://${MARIADB_USER}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE}
      PSU_BASE_WATT_W: ${PSU_BASE_WATT_W:-75}
      PSU_SAFETY_MARGIN: ${PSU_SAFETY_MARGIN:-1.3}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      ENABLE_WEB_LOOKUP: ${ENABLE_WEB_LOOKUP:-true}
      SEARXNG_BASE_URL: http://searxng:8080
      RECOMMEND_TOP_N: ${RECOMMEND_TOP_N:-5}
      RECOMMEND_DEFAULT_MAX_BUILDS: ${RECOMMEND_DEFAULT_MAX_BUILDS:-3}
      BACKUP_BACKEND: ${BACKUP_BACKEND:-local}
      LOCAL_BACKUP_DIR: ${LOCAL_BACKUP_DIR:-/app/backups}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
      AZURE_BACKUP_CONTAINER: ${AZURE_BACKUP_CONTAINER:-inventory-backups}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Only relevant for BACKUP_BACKEND=local; survives a container restart.
      - ./backups:/app/backups

  # Local LLM (Phase 3: /api/components/extract + /api/recommend).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    # Requires the NVIDIA Container Toolkit on the host. Remove this block if
    # deploying on a host without a passthrough-capable GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  # Web search for hardware spec lookup (Phase 3's /api/components/search +
  # /extract flow). settings.yml enables the JSON output format the backend
  # needs; SEARXNG_SECRET is patched into it by the image's entrypoint.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "${SEARXNG_PORT:-8080}:8080"

volumes:
  db_data:
  ollama_data:

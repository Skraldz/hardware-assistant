services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MARIADB_USER}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE}
      PSU_BASE_WATT_W: ${PSU_BASE_WATT_W:-75}
      PSU_SAFETY_MARGIN: ${PSU_SAFETY_MARGIN:-1.3}
    ports:
      - "${APP_PORT:-8000}:8000"

  # Local LLM. Not used by the backend yet (wired up in Phase 3), but kept in the
  # stack from the start so the full topology is already clone-and-run ready.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    # Requires the NVIDIA Container Toolkit on the host. Remove this block if
    # deploying on a host without a passthrough-capable GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  # Search engine used for hardware spec lookup (wired up in Phase 3's
  # /api/components/search + /extract flow). Not used by the backend yet.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8080}:8080"

volumes:
  db_data:
  ollama_data:
